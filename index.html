<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Feasibility Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      max-width: 42rem;
      margin: 4rem auto;
      padding: 0 1.25rem;
      color: #172033;
      background: #ffffff;
      line-height: 1.6;
    }

    main {
      padding: 2rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
    }

    code {
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      background: #eef2ff;
      font-weight: 700;
    }

    button {
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 0.45rem;
      color: #ffffff;
      background: #2547b8;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    #result {
      min-height: 1.6rem;
      margin-top: 1rem;
      font-weight: 700;
      color: #166534;
    }
  </style>
</head>
<body>
  <main>
    <h1>Website Access Test</h1>
    <p>This page is part of a harmless browser-access experiment.</p>
    <p>Experiment ID: <code>ACCESS-20260916-A1</code></p>

    <button id="run-test" type="button">Run harmless test</button>
    <p id="result" role="status" aria-live="polite"></p>
  </main>

  <script>
    document.querySelector("#run-test").addEventListener("click", () => {
      document.querySelector("#result").textContent =
        "TEST-COMPLETED-20260916-A1";
    });
  </script>
</body>
</html>
