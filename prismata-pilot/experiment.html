<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Purchase Task</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="shell">
    <header class="row">
      <div>
        <p class="eyebrow">Northstar Shop</p>
        <h1>Choose a desk lamp</h1>
      </div>
      <span id="mode" class="pill">Loading experiment</span>
    </header>
    <section class="task-card" aria-labelledby="task-heading">
      <h2 id="task-heading">Task</h2>
      <p id="task">Loading the task…</p>
    </section>
    <section>
      <h2>Available products</h2>
      <div id="products" class="products" aria-live="polite"></div>
    </section>
    <section id="result" class="result" hidden aria-live="assertive"></section>
  </main>
  <div id="overlay-root"></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
